name: Deploy Frontend to Azure

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: skill-swap-frontend
  NODE_VERSION: '24.x'

  REACT_APP_API_URL: 'https://skill-swap-app-azazfrh8fvd0fufz.canadacentral-01.azurewebsites.net/api'

  REACT_APP_AUTH0_DOMAIN: 'dev-nztqa6j7vdjyda18.us.auth0.com'
  REACT_APP_AUTH0_CLIENT_ID: 'RjLpacwAe4X7OqvNVWwhzUS5xbIJCpku'
  REACT_APP_AUTH0_AUDIENCE: 'https://dev-nztqa6j7vdjyda18.us.auth0.com/api/v2/'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React application
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ env.REACT_APP_API_URL }}
          REACT_APP_AUTH0_DOMAIN: ${{ env.REACT_APP_AUTH0_DOMAIN }}
          REACT_APP_AUTH0_CLIENT_ID: ${{ env.REACT_APP_AUTH0_CLIENT_ID }}
          REACT_APP_AUTH0_AUDIENCE: ${{ env.REACT_APP_AUTH0_AUDIENCE }}
          CI: false
        run: npm run build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: ./frontend
